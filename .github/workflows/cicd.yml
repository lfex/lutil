name: ci/cd

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**', 'task/**', 'feature/**', 'epic/**', 'codex/**']
    tags: ['**']
  pull_request:
    branches: [main, 'release/**', 'task/**', 'feature/**', 'epic/**', 'codex/**']
  schedule:
    - cron: '8 4 12 * *'

jobs:
  native:
    name: Erlang/OTP ${{ matrix.otp_version }} native checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp_version: ['27.3.4.19', '28.5.0.8', '29.1.2']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp_version }}
          rebar3-version: '3.28.0'
          version-type: strict
      - name: Check Rebar3 version
        run: rebar3 --version
      - name: Native checks
        run: make check-native
